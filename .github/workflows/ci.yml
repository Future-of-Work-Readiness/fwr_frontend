name: CI

# Vercel deploys through its own GitHub App (main → production, dev → preview/staging); those
# show up as deployments and commit statuses, not Actions runs. This workflow is the code-quality
# gate that runs alongside them.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typecheck-and-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Zero errors since 2026-11-13 (Phase 10 #12): any ESLint error fails the job. Warnings are
      # reported but don't fail it.
      - run: npm run lint

  audit:
    name: Security audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Reads package-lock.json only; no install needed. Fails on high/critical advisories in
      # production dependencies (dev-only advisories are tracked in the per-session dependency check).
      - run: npm audit --omit=dev --audit-level=high
